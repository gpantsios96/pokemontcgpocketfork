<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Πίνακας Διαχείρισης - Ηλεκτρολόγοι Θεσσαλονίκη</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        body {
            background: #f3f4f6;
        }

        .admin-header {
            background: linear-gradient(135deg, #1e40af 0%, #2563eb 100%);
            color: white;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .admin-header h1 {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .admin-actions {
            margin-top: 16px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn-admin {
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s;
        }

        .btn-admin:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .btn-danger {
            background: rgba(239, 68, 68, 0.9);
        }

        .btn-danger:hover {
            background: rgba(220, 38, 38, 1);
        }

        .dashboard-container {
            max-width: 1200px;
            margin: 32px auto;
            padding: 0 16px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 32px;
        }

        .stat-card {
            background: white;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            border-left: 4px solid #2563eb;
        }

        .stat-card.premium {
            border-left-color: #8b5cf6;
        }

        .stat-card.featured {
            border-left-color: #f59e0b;
        }

        .stat-label {
            font-size: 14px;
            color: #6b7280;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 36px;
            font-weight: 800;
            color: #1f2937;
        }

        .electricians-table {
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }

        .table-header {
            background: #f9fafb;
            padding: 16px 20px;
            border-bottom: 2px solid #e5e7eb;
        }

        .table-header h2 {
            font-size: 20px;
            color: #1f2937;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead th {
            background: #f9fafb;
            padding: 12px 16px;
            text-align: left;
            font-size: 12px;
            font-weight: 700;
            color: #6b7280;
            text-transform: uppercase;
            border-bottom: 2px solid #e5e7eb;
        }

        tbody td {
            padding: 16px;
            border-bottom: 1px solid #e5e7eb;
            font-size: 14px;
        }

        tbody tr:hover {
            background: #f9fafb;
        }

        .tier-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .tier-premium {
            background: #faf5ff;
            color: #6b21a8;
            border: 1px solid #8b5cf6;
        }

        .tier-featured {
            background: #fffbeb;
            color: #92400e;
            border: 1px solid #f59e0b;
        }

        .tier-free {
            background: #f3f4f6;
            color: #4b5563;
            border: 1px solid #d1d5db;
        }

        .loading {
            text-align: center;
            padding: 60px 20px;
            color: #6b7280;
        }

        @media (max-width: 768px) {
            table {
                font-size: 12px;
            }

            tbody td {
                padding: 12px 8px;
            }

            .stat-value {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>
    <div class="admin-header">
        <div class="dashboard-container">
            <h1>🔒 Πίνακας Διαχείρισης</h1>
            <p>Στατιστικά και Analytics για Ηλεκτρολόγοι Θεσσαλονίκη</p>
            <div class="admin-actions">
                <button class="btn-admin" onclick="refreshDashboard()">🔄 Ανανέωση</button>
                <button class="btn-admin" onclick="exportData()">📥 Εξαγωγή Δεδομένων</button>
                <button class="btn-admin btn-danger" onclick="logout()">🚪 Αποσύνδεση</button>
            </div>
        </div>
    </div>

    <div class="dashboard-container">
        <!-- Summary Stats -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Σύνολο Προβολών</div>
                <div class="stat-value" id="total-views">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Σύνολο Κλήσεων</div>
                <div class="stat-value" id="total-clicks">0</div>
            </div>
            <div class="stat-card premium">
                <div class="stat-label">Premium Επαγγελματίες</div>
                <div class="stat-value" id="premium-count">0</div>
            </div>
            <div class="stat-card featured">
                <div class="stat-label">Featured Επαγγελματίες</div>
                <div class="stat-value" id="featured-count">0</div>
            </div>
        </div>

        <!-- Electricians Table -->
        <div class="electricians-table">
            <div class="table-header">
                <h2>Αναλυτικά Στατιστικά ανά Επαγγελματία</h2>
            </div>
            <div id="table-container">
                <div class="loading">Φόρτωση δεδομένων...</div>
            </div>
        </div>
    </div>

    <script src="../js/analytics-secure.js"></script>
    <script src="../analytics.js"></script>
    <script src="dashboard.js"></script>
</body>
</html>
