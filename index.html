<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Βρείτε έμπειρους ηλεκτρολόγους στη Θεσσαλονίκη. Αξιόπιστοι επαγγελματίες για όλες τις ηλεκτρολογικές σας ανάγκες.">
    <title>Ηλεκτρολόγοι Θεσσαλονίκη - Βρείτε Έμπειρους Επαγγελματίες</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>Ηλεκτρολόγοι Θεσσαλονίκη</h1>
            <p class="tagline">Βρείτε τον κατάλληλο ηλεκτρολόγο για τις ανάγκες σας</p>
        </div>
    </header>

    <main>
        <section class="hero">
            <div class="container">
                <h2>Αναζήτηση Ηλεκτρολόγου</h2>
                <div class="search-bar">
                    <input
                        type="text"
                        id="searchInput"
                        placeholder="Αναζητήστε ηλεκτρολόγο ή περιοχή..."
                        aria-label="Αναζήτηση ηλεκτρολόγου"
                    >
                    <button id="searchBtn" class="btn-primary">Αναζήτηση</button>
                </div>
            </div>
        </section>

        <section class="featured">
            <div class="container">
                <h2>Προτεινόμενοι Ηλεκτρολόγοι</h2>
                <div id="electriciansList" class="electricians-grid">
                    <!-- Featured electricians will be added here -->
                    <p class="placeholder-text">Οι ηλεκτρολόγοι θα προστεθούν σύντομα...</p>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2025 Ηλεκτρολόγοι Θεσσαλονίκη. Όλα τα δικαιώματα διατηρούνται.</p>
        </div>
    </footer>

    <!-- Call confirmation toast -->
    <div id="callToast" class="call-toast">
        <span class="toast-icon">📞</span>
        <span class="toast-message">Γίνεται κλήση...</span>
    </div>

    <script src="analytics.js"></script>
    <script src="script.js"></script>
</body>
</html>
